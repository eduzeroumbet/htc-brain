[project]
name = "dubai-ai-agency-brain"
version = "0.1.0"
description = "Cérebro da agência de turismo 100% IA para Dubai e EAU — agentes Claude em uma única máquina"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "anthropic>=0.60",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "asyncpg>=0.29",
  "redis>=5.0",
  "apscheduler>=3.10",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "weasyprint>=62",
  "langfuse>=2.50",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "aiosmtplib>=3.0",
  "aioimaplib>=1.1",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools]
packages = { find = { include = ["brain*"] } }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
