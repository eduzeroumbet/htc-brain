# Descadastro no WhatsApp — o que fica FORA dos seis termos originais (PARAR, STOP, SAIR, UNSUBSCRIBE, ألغِ, रोकें).
# Lido por brain/core/descadastro.py. Decisão e motivos: docs/decisoes/descadastro-fora-da-lista.md.
#
# Escreva os termos como o cliente escreve (com acento, maiúsculas, hífen): o código normaliza a lista e a mensagem do mesmo jeito
# (NFKC, minúsculas, sem acentos/tashkeel/matras, sem pontuação e emoji, dígitos árabes e devanágari → 0-9, 3+ letras repetidas → 1).
# Os seis termos originais ficam no código (brain/core/consent.py) e continuam revogando mesmo que alguém os apague daqui.
#
# Classes:
#   lista    → a mensagem inteira é termo da lista (+ cortesia), sem "?": revoga na hora (comportamento atual).
#   ambiguo  → termo da lista com "?", termo ambíguo, ou pedido claro em forma de pergunta sem marcador de pedido educado:
#              suspende o marketing, pergunta uma vez e só revoga com "sim".
#   claro    → pedido claro fora da lista (frase, ou pedido + objeto a até 6 palavras): suspende o marketing e abre tarefa humana.
#   negacao  → se aparecer numa oração da mensagem, nada acontece ("não pare de me mandar as fotos").
#
# REVISÃO NATIVA PENDENTE antes de produção: ar, hi (devanágari e hinglish) e ru. pt, en e de foram escritos por falante fluente.
revisao_nativa_pendente: [ar, hi, ru]

# dias que a suspensão espera a resposta à pergunta; vencido o prazo sem resposta, o marketing segue suspenso e abre tarefa humana
prazo_confirmacao_dias: 7

# palavras que podem acompanhar o termo sem mudar o sentido ("STOP please", "PARAR por favor", "abbestellen danke")
# (somam-se às de consent._CORTESIA)
cortesia: [porfavor, porfa, obg, vlw, valeu, thx, ty, plz, kindly, bitte, danke, sofort, jetzt, пожалуйста, спасибо, сейчас, kripya, shukriya,
           dhanyavad, abhi, الان, الآن, حالا, مرسي, شكرًا]

idiomas:
