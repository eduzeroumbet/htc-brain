# resposta à pergunta de confirmação (aceita em qualquer idioma; vale a primeira expressão da mensagem, até 6 palavras)
respostas:
  # "yes"/"no" entre aspas: sem elas o YAML lê booleano
  sim: [sim, s, quero, confirmo, isso, pode, claro, com certeza, ok, "yes", "y", yeah, yep, yup, sure, confirm, okay, نعم, ايوه, أيوه, اي,
        ايه, أكيد, हाँ, हां, जी, haan, han, ha, haa, ji, да, ага, конечно, подтверждаю, ок, ja, jawohl, genau, gerne]
  nao: [não, "n", nunca, negativo, "no", nope, nah, لا, كلا, नहीं, ना, nahi, nahin, na, nai, нет, неа, nein, nee]
