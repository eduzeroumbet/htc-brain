name: dubai-ai-agency

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  # ───────────────────────── dados ─────────────────────────
  postgres:
    <<: *common
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-brain}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brain} -d ${POSTGRES_DB:-brain}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *common
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    <<: *common
    image: ${OBJECT_STORE_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}   # ver scripts/pick_object_store.sh (a MinIO fechou as imagens públicas)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-brain}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data

  # ───────────────────────── cérebro ─────────────────────────
  brain:
    <<: *common
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-brain}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-brain}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      LANGFUSE_HOST: http://langfuse-web:3000
      CHATWOOT_URL: http://chatwoot:3000
    volumes:
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      - ./knowledge:/app/knowledge:ro
      - ./brain:/app/brain
      - ./evals:/app/evals
      - brainstate:/app/state
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["uvicorn", "brain.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    expose: ["8000"]

  # ───────────────────────── inbox humana ─────────────────────────
  chatwoot:
    <<: *common
    image: chatwoot/chatwoot:latest
    env_file: .env
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?set CHATWOOT_SECRET_KEY_BASE in .env}
      FRONTEND_URL: https://${DOMAIN}/inbox
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://redis:6379/1
      ENABLE_ACCOUNT_SIGNUP: "false"
    entrypoint: ["docker/entrypoints/rails.sh"]
    command: ["sh", "-c", "bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - chatwootstorage:/app/storage
    expose: ["3000"]

  chatwoot-worker:
    <<: *common
    image: chatwoot/chatwoot:latest
    env_file: .env
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: https://${DOMAIN}/inbox
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://redis:6379/1
    entrypoint: ["docker/entrypoints/rails.sh"]
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on: [chatwoot]
    volumes:
      - chatwootstorage:/app/storage

  # ───────────────────────── observabilidade ─────────────────────────
  langfuse-web:
    <<: *common
    image: langfuse/langfuse:3
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-brain}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: https://${DOMAIN}/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      REDIS_CONNECTION_STRING: redis://redis:6379/2
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-brain}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      TELEMETRY_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_started }
    expose: ["3000"]

  langfuse-worker:
    <<: *common
    image: langfuse/langfuse-worker:3
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-brain}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_CONNECTION_STRING: redis://redis:6379/2
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-brain}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      TELEMETRY_ENABLED: "false"
    depends_on: [langfuse-web]

  clickhouse:
    <<: *common
    image: clickhouse/clickhouse-server:24
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhousedata:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  # ───────────────────────── borda / TLS ─────────────────────────
  caddy:
    <<: *common
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [brain, chatwoot, langfuse-web]

volumes:
  pgdata:
  redisdata:
  miniodata:
  brainstate:
  chatwootstorage:
  clickhousedata:
  caddydata:
  caddyconfig:
